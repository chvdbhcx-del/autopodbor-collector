name: sample
on:
  workflow_dispatch:
    inputs:
      urls: { description: 'JSON [[name, url, opts?]]', required: true }
permissions: { contents: write }
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe/sample.mjs
        env: { URLS: '${{ inputs.urls }}' }
      - name: Push to samples branch
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan samples-tmp && git rm -rq --cached . && git add -f samples
          git commit -qm "samples ${{ github.run_id }}" && git push -f origin HEAD:samples
